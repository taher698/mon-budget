name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild \
            -workspace ios/MonBudget.xcworkspace \
            -scheme MonBudget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/MonBudget.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/MonBudget.xcarchive/Products/Applications/MonBudget.app Payload/
          zip -r MonBudget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonBudget-ipa
          path: MonBudget.ipa
